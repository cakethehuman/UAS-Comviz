readme = "README.md"
authors = [
    { name = "cakethehuman", email = "willsonputra17@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.164.0",
    "keras-hub>=0.33.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "opencv-python>=5.1.0.95",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "python-multipart>=0.0.34",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
    "tensorflow>=2.21.0",
    "uvicorn[standard]>=0.54.0",
